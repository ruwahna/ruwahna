name: Generate Pacman Light

on:
  # Berjalan otomatis setiap 24 jam
  schedule:
    - cron: "0 0 * * *" 
  
  # Mengizinkan menjalankan workflow secara manual via tab Actions
  workflow_dispatch:
  
  # Berjalan setiap kali ada push di branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Membuat animasi Pacman tema terang (light)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ruwahna
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=yellow
            dist/github-contribution-grid-snake-dark.svg?palette=github-light&color_snake=yellow
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
          
      # Push hasil ke branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
