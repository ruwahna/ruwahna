name: generate animation

on:
  # Jalankan secara otomatis setiap 24 jam
  schedule:
    - cron: "0 0 * * *" 
  
  # Jalankan secara manual
  workflow_dispatch:
  
  # Jalankan setiap kali ada push ke branch main
  push:
    branches:
    - main
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Membuat game ular dari grafik kontribusi GitHub, output gambar SVG
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ruwahna  # Ganti dengan username Anda jika perlu
          outputs: |
            dist/github-contribution-grid-snake.svg
            # Baris di bawah ini sekarang menghasilkan gambar tema terang default
            dist/github-contribution-grid-snake-dark.svg

      # Commit dan dorong hasilnya ke branch output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
